; Valeurs par défaut des réglages du plugin, lues par config::byKey() et
; config::byKeys(). La page de configuration passe par la seconde, qui ignore le
; défaut codé dans la classe : une clé absente d'ici s'y affiche vide, et une
; case cochée par défaut s'y montre décochée puis s'enregistre à 0.
; La section doit porter l'identifiant du plugin : nommée [default], elle serait
; entièrement inerte.
[jeeglowbe]
title = ""
tone = "auto"
shortNames = 1
showUnassigned = 1
kioskStart = 0
kioskIdle = 0
kioskDim = 0
